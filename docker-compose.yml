services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - CORS_ORIGINS=http://127.0.0.1:5173,http://localhost:5173
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # 容器内 /api 代理到 backend 服务
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
